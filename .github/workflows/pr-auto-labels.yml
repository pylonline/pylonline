name: Suite Label Setup

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ensure-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure suite labels exist
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const rerunLabels = [
              { name: "ci", color: "0E8A16", description: "[Pylon Line] Re-run workspace lint/format checks." },
              { name: "ut", color: "1D76DB", description: "[Pylon Line] Re-run workspace unit tests + coverage." },
              { name: "perf", color: "FBCA04", description: "[Pylon Line] Re-run portal perf smoke in workspace CI." }
            ];
            try {
              for (const label of rerunLabels) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: label.name });
                  await github.rest.issues.updateLabel({
                    owner, repo, name: label.name, color: label.color, description: label.description,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.issues.createLabel({
                    owner, repo, name: label.name, color: label.color, description: label.description,
                  });
                }
              }
              core.info("Repo suite labels are ready. Each suite workflow adds and removes its own PR label.");
            } catch (error) {
              if (error.status === 403) {
                core.warning(
                  "PR label automation is blocked by token permissions. " +
                    "Set Actions workflow permissions to Read and write."
                );
                return;
              }
              throw error;
            }
