name: perf

on:
  pull_request:
    branches: [main, release]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: workspace-pr-perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: portal
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PACKAGES_PAT }}
          submodules: recursive
      - name: Mark suite in progress
        uses: ./.github/actions/pr-suite-label
        with:
          label: perf
          mode: add

      - name: Validate workspace secret
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGES_TOKEN}" ]; then
            echo "::error::Missing PACKAGES_PAT in the pylonline workspace repo."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Configure GitHub Packages auth
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          set -euo pipefail
          {
            echo "@pylonline:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${PACKAGES_TOKEN}"
            echo "always-auth=true"
          } > ~/.npmrc

      - name: Install portal dependencies
        run: bash .github/scripts/npm-ci-retry.sh

      - name: Install core-ui build deps
        working-directory: core-ui
        run: npm ci --no-audit --no-fund

      - name: Prepare core-ui for wrangler bundling
        run: npm run core-ui:prepare -- --path ../core-ui

      - name: Verify core-ui sibling for build imports
        run: test -f ../core-ui/pages/templates/shared/template-shared-modal-shell.html

      - name: Sync shared UI
        run: npm run ui:sync

      - name: Apply local D1 migrations
        run: npx wrangler d1 migrations apply portal_db --local

      - name: Start local Worker
        run: |
          node scripts/dev/wrangler/start-wrangler-ci-background.cjs \
            --port=8789 \
            --host=127.0.0.1 \
            --log=/tmp/portal-perf-smoke.log \
            --pid=/tmp/portal-perf-smoke.pid

      - name: Wait for local Worker
        id: wait-for-worker
        run: node scripts/dev/wrangler/wait-for-worker-http.cjs --url=http://127.0.0.1:8789/signin --timeout-ms=240000

      - name: Show Worker log when wait fails
        if: failure() && steps.wait-for-worker.outcome == 'failure'
        run: |
          echo "::group::wrangler dev log (tail)"
          tail -n 150 /tmp/portal-perf-smoke.log || true
          echo "::endgroup::"

      - name: Run perf smoke checks
        run: npm run perf:smoke:pr

      - name: Stop local Worker
        if: always()
        run: node scripts/dev/wrangler/stop-wrangler-ci-background.cjs --pid=/tmp/portal-perf-smoke.pid

      - name: Upload local Worker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-portal-perf-smoke-log-${{ github.run_id }}
          path: /tmp/portal-perf-smoke.log

      - name: Remove consumed suite label
        if: ${{ always() && !cancelled() }}
        uses: ./.github/actions/pr-suite-label
        with:
          label: perf
          mode: remove
