# pull_request_target runs from the default branch and receives labeled events even when
# the label is added by automation (PACKAGES_PAT / GITHUB_TOKEN). It dispatches
# workspace-ci via workflow_dispatch because those token actors do not re-trigger pull_request.
name: PR Label Rerun Dispatch

on:
  pull_request_target:
    types: [labeled]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ contains(fromJSON('["preflight","ci","ut","perf"]'), github.event.label.name) }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch workspace CI for label rerun
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PACKAGES_PAT || github.token }}
          script: |
            const label = context.payload.label.name;
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.ref;
            const pr_number = String(context.payload.pull_request.number);
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: "workspace-ci.yml",
                ref,
                inputs: {
                  trigger_label: label,
                  pr_number,
                },
              });
              core.info(`Dispatched workspace-ci (${label}) for PR #${pr_number} on ${ref}`);
            } catch (error) {
              core.setFailed(`Failed to dispatch workspace-ci for label "${label}": ${error.message}`);
              throw error;
            }
