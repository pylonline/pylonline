name: Workspace CI (Checks + Tests + Coverage)

on:
  # PR validation is the canonical signal for merge readiness.
  pull_request:
    branches:
      - main
      - release
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  workspace:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' || contains(fromJSON('["preflight","ci","ut"]'), github.event.label.name) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PACKAGES_PAT }}
          submodules: recursive

      - name: Validate workspace secret
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGES_TOKEN}" ]; then
            echo "::error::Missing PACKAGES_PAT in the pylonline workspace repo."
            echo "::error::It must allow private repo checkout and GitHub Packages reads."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure GitHub Packages auth
        # PACKAGES_PAT is required for private submodule checkout. Workspace install links
        # @pylonline/core-lint and @pylonline/core-ui from checked-out submodules (see
        # pnpm-workspace.yaml overrides) — it does not download those packages from GitHub Packages.
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          set -euo pipefail
          {
            echo "@pylonline:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${PACKAGES_TOKEN}"
            echo "always-auth=true"
          } > ~/.npmrc

      - name: Install workspace
        # Workspace root scripts live in package.json:
        #   package.json#L5-L18
        # We allow lockfile refresh here because submodule/package changes can land
        # before the workspace lockfile is intentionally updated.
        run: pnpm install --no-frozen-lockfile

      - name: Show submodule status
        # package.json#L6-L8
        run: pnpm run submodules:status

      - name: Check workspace root
        # package.json root scripts:
        #   check:workspace-root -> core-lint check using workspace core-lint.config.cjs
        # root config now checks only workspace-owned root files and config wrappers.
        run: pnpm run check:workspace-root

      - name: Check core-lint
        # core-lint/package.json#L7-L15 -> "check": node bin/core-lint.cjs check
        # core-lint/bin/core-lint.cjs#L44-L49 -> format + eslint + stylelint + ui checks
        # core-lint/core-lint.config.cjs#L3-L20 defines the checked paths for this repo.
        run: pnpm --filter @pylonline/core-lint --fail-if-no-match run check

      - name: Check core-ui
        # core-ui/package.json#L13-L23 -> shared lint/stylelint/format/check scripts
        # core-ui/core-lint.config.cjs#L3-L20 defines lintRoots/stylelintRoots/formatRoots.
        run: pnpm --filter @pylonline/core-ui --fail-if-no-match run check

      - name: Check scripts
        # scripts/package.json#L6-L17 -> shared lint/stylelint/format/check scripts
        # scripts/core-lint.config.cjs#L3-L18 defines lintRoots/stylelintRoots/formatRoots.
        run: pnpm --filter @pylonline/scripts --fail-if-no-match run check

      - name: Check portal
        # portal/package.json#L31-L36
        #   core-ui:prepare -> scripts/core-ui/prepare-core-ui.cjs
        #   ui:sync         -> scripts/core-ui/sync-core-ui.cjs
        #   check           -> core-lint check using portal/core-lint.config.cjs
        # portal/core-lint.config.cjs#L3-L26 also adds ui:check as a repo-specific check.
        run: |
          pnpm --filter @pylonline/portal --fail-if-no-match run core-ui:prepare
          pnpm --filter @pylonline/portal --fail-if-no-match run ui:sync
          pnpm --filter @pylonline/portal --fail-if-no-match run check

      # Pylon submodule is scaffold-only (no scripts/, app/, tests/) — skip until local runtime lands.

      - name: Unit tests (workspace aggregate)
        # Excludes @pylonline/pylon until app/scripts/tests are checked in.
        run: pnpm -r --if-present --filter '!@pylonline/pylon' run test

      - name: Coverage (workspace aggregate)
        # package.json#L10-L14 now includes workspace-level coverage orchestration.
        # Each repo writes c8 output into its own coverage/ directory and prints a
        # text summary to the job log.
        run: pnpm -r --if-present --filter '!@pylonline/pylon' run coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workspace-coverage
          path: |
            core-lint/coverage
            core-ui/coverage
            portal/coverage
            scripts/coverage
          if-no-files-found: error

  portal-perf-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' || contains(fromJSON('["preflight","ci","ut","perf"]'), github.event.label.name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: portal
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PACKAGES_PAT }}
          submodules: recursive

      - name: Validate workspace secret
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGES_TOKEN}" ]; then
            echo "::error::Missing PACKAGES_PAT in the pylonline workspace repo."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Configure GitHub Packages auth
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          set -euo pipefail
          {
            echo "@pylonline:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${PACKAGES_TOKEN}"
            echo "always-auth=true"
          } > ~/.npmrc

      - name: Install portal dependencies
        run: bash .github/scripts/npm-ci-retry.sh

      - name: Install core-ui build deps
        working-directory: core-ui
        run: npm ci --no-audit --no-fund

      - name: Prepare core-ui for wrangler bundling
        run: npm run core-ui:prepare -- --path ../core-ui

      - name: Verify core-ui sibling for build imports
        run: test -f ../core-ui/pages/templates/shared/template-shared-modal-shell.html

      - name: Sync shared UI
        run: npm run ui:sync

      - name: Apply local D1 migrations
        run: npx wrangler d1 migrations apply portal_db --local

      - name: Start local Worker
        run: |
          node scripts/dev/start-wrangler-ci-background.cjs \
            --port=8789 \
            --host=127.0.0.1 \
            --log=/tmp/portal-perf-smoke.log \
            --pid=/tmp/portal-perf-smoke.pid

      - name: Wait for local Worker
        id: wait-for-worker
        run: node scripts/dev/wait-for-worker-http.cjs --url=http://127.0.0.1:8789/signin --timeout-ms=240000

      - name: Show Worker log when wait fails
        if: failure() && steps.wait-for-worker.outcome == 'failure'
        run: |
          echo "::group::wrangler dev log (tail)"
          tail -n 150 /tmp/portal-perf-smoke.log || true
          echo "::endgroup::"

      - name: Run perf smoke checks
        run: npm run perf:smoke:pr

      - name: Stop local Worker
        if: always()
        run: node scripts/dev/stop-wrangler-ci-background.cjs --pid=/tmp/portal-perf-smoke.pid

      - name: Upload local Worker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-portal-perf-smoke-log-${{ github.run_id }}
          path: /tmp/portal-perf-smoke.log

  clear-rerun-label:
    if: >-
      ${{ always() && github.event_name == 'pull_request' && (
        (needs.workspace.result == 'success' && needs.portal-perf-smoke.result == 'success'
          && (contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'ut')))
        || (needs.portal-perf-smoke.result == 'success' && needs.workspace.result == 'skipped'
          && contains(github.event.pull_request.labels.*.name, 'perf'))
      ) }}
    needs: [workspace, portal-perf-smoke]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove consumed rerun labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PACKAGES_PAT || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const labelNames = context.payload.pull_request.labels.map((label) => label.name);
            const workspaceOk = "${{ needs.workspace.result }}" === "success";
            const perfOk = "${{ needs.portal-perf-smoke.result }}" === "success";
            const toRemove = [];
            if (workspaceOk && perfOk) {
              if (labelNames.includes("ci")) toRemove.push("ci");
              if (labelNames.includes("ut")) toRemove.push("ut");
            }
            if (perfOk && labelNames.includes("perf")) {
              const workspaceSkipped = "${{ needs.workspace.result }}" === "skipped";
              if (workspaceSkipped || workspaceOk) toRemove.push("perf");
            }
            for (const name of toRemove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (error) {
                if (error.status === 403) {
                  core.warning("Skipping rerun-label cleanup due to token permissions (403).");
                  return;
                }
                if (error.status !== 404) throw error;
              }
            }
